    <div class="sidebar-bottom">
      <a class="visit-link" href="/index.html" target="_blank" rel="noopener">Voir le blog <span aria-hidden="true">↗</span></a>

  </dialog>
  <div id="notifications" role="status" aria-live="polite" aria-atomic="true"></div>
  <input id="upload-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/svg+xml,image/x-icon" multiple hidden>
  <input id="replace-input" type="file" accept="image/*" hidden>
