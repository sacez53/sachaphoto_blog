# Déploie le blog sur GitHub Pages
name: Deploy static content to Pages

on:
  # À chaque envoi sur la branche principale
  push:
    branches: ["main"]

  # Lancement manuel depuis l'onglet Actions
  workflow_dispatch:

  # Publication des articles programmés. GitHub peut retarder ces passages de plusieurs heures.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

# Un seul déploiement à la fois, sans interrompre celui qui est en cours.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Un passage planifié ne déploie que si un article est arrivé à échéance.
  decide:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check whether a deployment is needed
        id: decision
        run: node _manager/needs-deploy.mjs

  deploy:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Check published content
        run: npm run check-site
      - name: Prepare public files
        run: npm run build
      - name: Install image optimizer
        run: npm install --no-save --no-package-lock --ignore-scripts sharp@0.35.5
      - name: Optimize published images
        run: node _manager/optimize-images.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      # GitHub peut mettre quelques secondes à rendre l'archive disponible.
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
